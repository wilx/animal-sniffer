# Compiling Thread.threadId() requires JDK 19 or newer. CI's JDK 21 job runs these tests.
invoker.java.version = 19+
invoker.goals = clean verify -Dkotlin.version=1.9.21 -Dcase=positive-19
invoker.goals.2 = clean verify -Dcase=positive-23
invoker.goals.3 = clean verify -Pscopes -Dcase=positive-scopes
invoker.goals.4 = clean verify -Pnegative -Dkotlin.version=1.9.21 -Dcase=negative-19
invoker.buildResult.4 = failure
invoker.goals.5 = clean verify -Pnegative -Dcase=negative-23
invoker.buildResult.5 = failure
invoker.goals.6 = clean verify -Dcase=negative-scopes
invoker.profiles.6 = negative,scopes
invoker.buildResult.6 = failure
